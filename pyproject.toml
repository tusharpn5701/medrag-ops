[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag"
version = "0.1.0"
description = "MedRAG Ops: a medical question-answering RAG service with an end-to-end MLOps loop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tushar Purushothaman Namboodiri" }]
# Runtime needed by the API container (kept small for a 512 MB instance)
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "bm25s>=0.2",
  "PyStemmer>=2.2",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "prometheus-client>=0.20",
  "openai>=1.30",
  "boto3>=1.34",
]

[project.optional-dependencies]
dense = ["fastembed>=0.3"]
train = ["mlflow>=2.17,<3", "sqlalchemy<2.1", "dvc>=3.50", "fastembed>=0.3", "pandas>=2"]
dev = ["pytest>=8", "httpx>=0.27", "moto[server]>=5", "ruff>=0.5"]

[project.scripts]
medrag = "medrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medrag = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-ignore = ["B905"]  # zip() over equal-length lists by construction
ignore = ["E501", "B008"]

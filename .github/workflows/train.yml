name: Train

# Retrains on a schedule, on demand, or when the monitor detects drift.
# Pipeline: label production questions -> dvc repro (download, prepare, train, register)
# -> if the challenger beats the champion, trigger the deploy workflow.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was started
        required: false
        default: manual
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC

permissions:
  contents: read
  actions: write

concurrency:
  group: train
  cancel-in-progress: false

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
  MEDRAG_LOG_BUCKET: ${{ secrets.MEDRAG_LOG_BUCKET }}
  MEDRAG_S3_ENDPOINT_URL: ${{ secrets.MEDRAG_S3_ENDPOINT_URL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MEDRAG_STRICT: "1"            # a candidate that fails to build fails the run
  MLFLOW_DISABLE_AGENT_HINT: "1"
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[train]"
      - name: Check the registry is configured
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "::error::Add the MLFLOW_TRACKING_URI / USERNAME / PASSWORD secrets (DagsHub) so the registry persists between runs."
            exit 1
          fi
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            .cache/fastembed
          key: medquad-raw-v1-fastembed-v1
      - name: Label recent production questions (feedback loop)
        if: env.GROQ_API_KEY != '' && env.MEDRAG_LOG_BUCKET != ''
        run: |
          if medrag export --role champion --out artifacts/bundle; then
            medrag label --limit 40
          else
            echo "No champion yet, skipping labelling"
          fi
      - name: Run the pipeline (dvc repro)
        run: dvc repro
      - name: Job summary
        if: always()
        run: |
          echo "Reason: ${{ github.event.inputs.reason || github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          medrag summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            data/processed/stats.json
            dvc.lock
      - name: Deploy the new champion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          promoted=$(python -c "import json; print(str(json.load(open('reports/promotion.json'))['promoted']).lower())")
          version=$(python -c "import json; print(json.load(open('reports/promotion.json'))['challenger_version'])")
          if [ "$promoted" = "true" ]; then
            gh workflow run deploy.yml -f reason="promoted model v$version"
            echo "Triggered deploy of v$version" >> "$GITHUB_STEP_SUMMARY"
          fi
